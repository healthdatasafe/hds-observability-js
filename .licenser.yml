files:
  package.json:
    json:
      force:
        author: "{AUTHOR_NAME} ({AUTHOR_WEB})"
        license: "{SPDX}"
    siblingLicenseFile:
      name: LICENSE

  README.md:
    footer:
      startBlock: "\n\n## License\n\n"
      linePrefix: ""
      endBlock: ""
      license: "{README_LICENSE}"

ignore:
- .git
- node_modules
- dist

