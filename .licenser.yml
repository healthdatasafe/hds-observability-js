substitutions:
  YEARS:
    start: 2026
    end: CURRENT_YEAR
  AUTHOR_NAME: Health Data Safe
  AUTHOR_WEB: https://www.healthdatasafe.org
  SPDX: BSD-3-Clause
  README_LICENSE: "[BSD-3-Clause](LICENSE)"
